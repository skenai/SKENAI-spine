name: boundary

on:
  push:
  pull_request:

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Boundary check — no private terms, no engine internals
        run: npm run check:boundary

      - name: Actor gate — direct pushes must come from network accounts
        # Outside contributions arrive via pull_request and may carry ANY
        # commit author — content safety is the check:boundary + test steps'
        # job. A commit-author allowlist would make outside merges impossible.
        # On push events the actor is the pusher: only repo collaborators can
        # push, and we additionally require a network account identity.
        run: |
          ACTOR="${{ github.actor }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR opened by $ACTOR — outside contributors welcome"
            exit 0
          fi
          case "$ACTOR" in
            skenxt|Skenai|devin-ai-integration[bot]) echo "Push actor $ACTOR OK" ;;
            *) echo "::error::Push actor not allowlisted: $ACTOR"; exit 1 ;;
          esac

      - name: Tests
        run: npm test
